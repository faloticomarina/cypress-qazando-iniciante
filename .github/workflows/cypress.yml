#nome da pipeline
name: Run Basic

# em que momento será executada
on: 
    pull_request: 
        branches: [main]

jobs: 
    # o que vai ser feito nessa pipeline
    # só teremos um job: rodar os testes
    cypress-run:
        #máquina que será executado
        runs-on: ubuntu-latest

        #passo a passo para rodar os testes
        steps: 
            #clone do projeto
            - name: Checkout/Clone do projeto
              uses: actions/checkout@v6

            # exempplo de execução no terminal
            - name: instalar dependencias do projeto
              run: echo Marina Falotico   

            # execução e config do prjeto  
            - name: Run testes
              uses: cypress-io/github-action@v7.0.0
              with: 
                record: true
                env:
                CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}